[package]
name = "stm32f446"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"
rtt-target = "0.6.1"
rtic = { version = "2.2.0", features = ["thumbv7-backend"] }
stm32f4xx-hal = { version = "0.21.0", features = ["stm32f446"] }

# [profile.dev]
# opt-level = 2
# debug = true
# codegen-units = 1
# lto = false
# panic = "abort"

# [profile.release]
# opt-level = 3
# debug = true
# codegen-units = 1
# lto = true
# panic = "abort"